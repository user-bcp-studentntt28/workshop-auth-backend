quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:4200}
auth.session-cookie.secure=${SESSION_COOKIE_SECURE:false}
%prod.auth.session-cookie.secure=${SESSION_COOKIE_SECURE:true}
quarkus.http.cors.origins=${app.allowed-origin}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
